name: Auto-merge validated reports

on:
  workflow_run:
    workflows: ["Validate community reports"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted automation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Merge the validated data-only contribution
        env:
          PERFCOMPARATOR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/auto_merge.py "$GITHUB_EVENT_PATH"
