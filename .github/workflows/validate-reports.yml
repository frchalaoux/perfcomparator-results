name: Validate community reports

on:
  pull_request:
    paths:
      - ".github/workflows/validate-reports.yml"
      - "catalog/**"
      - "reports/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: validate-reports-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          enable-cache: false

      - name: Install Python and development dependencies
        run: uv sync --locked --dev

      - name: Install the pinned PerfComparator validator
        run: |
          uv tool install "git+https://github.com/frchalaoux/perfcomparator@efdf69e242d0fd160853f43cb5edf5a7756e9f9a"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Check Python and JavaScript
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run pytest -q
          node --check site/catalog.mjs
          node --check site/app.mjs
          node --test tests/test_catalog_ui.mjs

      - name: Validate reports and tracked index
        run: |
          uv run python scripts/build_catalog.py validate
          uv run python scripts/build_catalog.py check

      - name: Build the static site
        run: uv run python scripts/build_site.py
