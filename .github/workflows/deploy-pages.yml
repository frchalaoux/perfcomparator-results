name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          enable-cache: false

      - name: Install Python and development dependencies
        run: uv sync --locked --dev

      - name: Install the pinned PerfComparator validator
        run: |
          uv tool install "git+https://github.com/frchalaoux/perfcomparator@efdf69e242d0fd160853f43cb5edf5a7756e9f9a"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Validate the catalog
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run pytest -q
          node --test tests/test_catalog_ui.mjs
          uv run python scripts/build_catalog.py validate
          uv run python scripts/build_catalog.py check

      - name: Build the static site
        run: uv run python scripts/build_site.py

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
