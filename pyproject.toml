[project]
name = "perfcomparator-results"
version = "0.1.0"
description = "Validation et indexation du catalogue communautaire PerfComparator"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
